<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Página en mantenimiento de la Sección San Chárbel Makhlouf de la Adoración Nocturna.">
  <title>En mantenimiento | Sección San Chárbel Makhlouf</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #f3f5f3;
      color: #303b33;
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.75;
      display: flex;
      flex-direction: column;
    }
    .contenedor {
      width: min(920px, calc(100% - 32px));
      margin: auto;
      padding: 36px 0;
    }
    .tarjeta {
      background: #fff;
      border-radius: 12px;
      padding: 48px 38px;
      box-shadow: 0 3px 18px rgba(0, 0, 0, .055);
      text-align: center;
    }
    h1 {
      margin: 0 0 16px;
      color: #397a46;
      font-size: clamp(1.55rem, 4vw, 2rem);
      line-height: 1.3;
    }
    p { margin: 0; }
    .mensaje { font-size: 1.05rem; }
    footer {
      text-align: center;
      color: #69746b;
      font-size: .82rem;
      padding: 16px;
    }
    @media (max-width: 600px) {
      .contenedor { width: min(100% - 20px, 920px); }
      .tarjeta { padding: 36px 22px; }
    }
  </style>
</head>
<body>
  <main class="contenedor">
    <section class="tarjeta" aria-labelledby="titulo-mantenimiento">
      <h1 id="titulo-mantenimiento">Página en mantenimiento</h1>
      <p class="mensaje">Estamos realizando labores de mantenimiento.<br>
      Agradecemos su comprensión. Por favor, vuelva a visitarnos más tarde.</p>
    </section>
  </main>
  <footer>Sección San Chárbel Makhlouf · Adoración Nocturna</footer>
</body>
</html>
