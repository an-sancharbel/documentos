<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Documentos Adoración Nocturna - Sección San Chárbel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 850px;
      margin: auto;
      padding: 20px;
      background: #f7f7f7;
      text-align: center;
      color: #333;
    }

    h1 {
      color: #2e7d32;
      margin-bottom: 8px;
    }

    .subtitulo {
      margin-top: 0;
      color: #555;
    }

    .archivo {
      background: white;
      margin: 10px 0;
      padding: 14px;
      border-radius: 10px;
      box-shadow: 0 2px 5px #ddd;
      text-align: center;
    }

    a {
      text-decoration: none;
      color: #1565c0;
      font-size: 18px;
      font-weight: bold;
    }

    a:hover {
      text-decoration: underline;
    }

    .volver {
      display: inline-block;
      margin: 15px 0;
      padding: 10px 16px;
      background: #2e7d32;
      color: white;
      border-radius: 8px;
      font-size: 16px;
    }

    .volver:hover {
      background: #256428;
      text-decoration: none;
    }

    .ruta-actual {
      margin: 15px 0;
      font-size: 15px;
      color: #666;
    }

    .estado { margin: 12px 0 18px; padding: 10px 14px; border-radius: 8px; font-size: 14px; font-weight: bold; }
    .estado.error { background:#ffebee; color:#b71c1c; }
    .estado[hidden] { display: none; }

    .mensaje {
      background: white;
      padding: 18px;
      border-radius: 10px;
      box-shadow: 0 2px 5px #ddd;
      color: #555;
    }
  </style>
</head>

<body>
  <h1>📚 Documentos Adoración Nocturna</h1>
  <p class="subtitulo">Sección San Chárbel Makhlouf</p>

  <div id="estado" class="estado cargando" hidden></div>

  <p>Documentos disponibles:</p>

  <div id="rutaActual" class="ruta-actual"></div>
  <div id="volver"></div>
  <div id="lista" class="mensaje">Cargando documentos...</div>

<script src="documentos.min.js" defer></script>

</body>
</html>
